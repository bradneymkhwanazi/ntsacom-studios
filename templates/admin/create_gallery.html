{% extends 'base.html' %}
{% block title %}Create Gallery — Ntsacom Studios{% endblock %}
{% block nav %}
<nav>
    <a href="{{ url_for('admin_dashboard') }}" class="brand">📷 Ntsacom Studios</a>
    <div class="nav-links">
        <a href="{{ url_for('admin_dashboard') }}">← Back</a>
        <a href="{{ url_for('admin_logout') }}">Logout</a>
    </div>
</nav>
{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 40px auto;">
    <div class="card">
        <h2>Create New Gallery</h2>
        <form method="POST">
            <label for="name">Gallery Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Johnson Wedding 2026" required>

            <label for="customer_email">Customer Email (optional)</label>
            <input type="email" id="customer_email" name="customer_email" placeholder="customer@email.com">

            <label for="package">Download Package</label>
            <select id="package" name="package">
                <option value="unlimited">Unlimited Downloads</option>
                <option value="50">50 Downloads</option>
                <option value="20">20 Downloads</option>
            </select>

            <label for="expiry">Gallery Expiry</label>
            <select id="expiry" name="expiry">
                <option value="never">Never expires</option>
                <option value="30">30 days</option>
                <option value="60">60 days</option>
                <option value="90">90 days</option>
            </select>

            <label for="password">Gallery Password (optional)</label>
            <input type="text" id="password" name="password" placeholder="Leave empty for no password">

            <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

            <label class="checkbox-label">
                <input type="checkbox" name="requires_payment" id="requires_payment" onchange="document.getElementById('payment-section').style.display = this.checked ? 'block' : 'none'">
                Require payment before access
            </label>

            <div id="payment-section" style="display: none;">
                <label for="amount">Amount (ZAR)</label>
                <input type="number" id="amount" name="amount" placeholder="e.g. 2500" step="0.01" min="0">
            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Create Gallery</button>
        </form>
    </div>
</div>
{% endblock %}
