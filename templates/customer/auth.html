{% extends 'base.html' %}
{% block title %}Enter Password — Ntsacom Studios{% endblock %}
{% block extra_css %}
<style>body { background: #1a1a1a; color: #fff; }</style>
{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 80px auto;">
    <div class="card" style="background: #2a2a2a;">
        <h2 style="text-align: center; margin-bottom: 10px;">🔒 Protected Gallery</h2>
        <p style="text-align: center; color: #999; margin-bottom: 25px; font-size: 14px;">Enter the password to view this gallery</p>
        <form method="POST">
            <input type="password" name="password" placeholder="Password" required style="background:#333;border-color:#444;color:#fff;">
            <button type="submit" class="btn" style="width: 100%;">View Gallery</button>
        </form>
    </div>
</div>
{% endblock %}
